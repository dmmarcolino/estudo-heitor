<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno de Estudos com IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EE;
    --paper-line:#E7DFCC;
    --navy:#1F2A44;
    --navy-soft:#33436B;
    --teal:#2E9E8F;
    --teal-dark:#237A6F;
    --amber:#F0A83E;
    --coral:#E2694B;
    --green:#3C9A5F;
    --red:#D4483C;
    --ink:#2B2B24;
    --muted:#7A7566;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--paper);
    background-image:linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size:100% 2.1em;
    color:var(--ink);
    min-height:100vh;
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:22px 20px 20px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:14px;
    background:repeating-linear-gradient(180deg, var(--amber) 0 10px, var(--navy) 10px 24px);
    opacity:.85;
  }
  header h1{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:1.5rem; margin:0 0 4px 18px; }
  header p{ margin:0 0 0 18px; font-size:.9rem; color:#C6CEDF; }

  main{ max-width:820px; margin:0 auto; padding:20px 16px 60px; }
  .card{
    background:#fff; border:1px solid var(--paper-line); border-radius:var(--radius);
    padding:20px; margin-bottom:18px; box-shadow:0 2px 10px rgba(31,42,68,0.06);
  }
  .upload-zone{ border:2px dashed #C9BFA4; border-radius:var(--radius); padding:22px 16px; text-align:center; background:#FFFDF8; }
  .upload-zone.has-file{ border-color:var(--teal); background:#F0FAF8; }
  .upload-zone input[type=file]{ display:none; }
  .upload-btn{
    display:inline-block; background:var(--teal); color:#fff; font-weight:600;
    padding:10px 20px; border-radius:999px; cursor:pointer; font-size:.95rem;
  }
  .upload-btn:hover{ background:var(--teal-dark); }
  #fileName{ margin-top:10px; font-size:.85rem; color:var(--muted); }
  .titulo-input{
    width:100%; max-width:340px; margin:12px auto 0; display:block;
    padding:9px 12px; border:1px solid var(--paper-line); border-radius:8px; font-family:inherit; font-size:.9rem;
  }

  nav.tabs{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  nav.tabs button{
    flex:1; min-width:110px; font-family:'Baloo 2', sans-serif; font-weight:700; font-size:.9rem;
    padding:12px 8px; border:none; border-radius:12px 12px 0 0; background:#EDE6D3;
    color:var(--navy-soft); cursor:pointer; opacity:.75;
  }
  nav.tabs button.active{ background:#fff; opacity:1; box-shadow:0 -2px 8px rgba(31,42,68,0.05); }
  nav.tabs button:disabled{ cursor:not-allowed; opacity:.4; }

  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  button.primary{
    background:var(--coral); color:#fff; border:none; font-weight:600; font-size:.95rem;
    padding:11px 22px; border-radius:999px; cursor:pointer;
  }
  button.primary:hover{ filter:brightness(0.95); }
  button.primary:disabled{ background:#CBC2AE; cursor:not-allowed; }
  button.secondary{
    background:#fff; color:var(--navy-soft); border:1.5px solid var(--paper-line); font-weight:600;
    font-size:.88rem; padding:8px 16px; border-radius:999px; cursor:pointer;
  }

  .loading{ display:flex; align-items:center; gap:10px; color:var(--muted); font-size:.9rem; padding:10px 0; }
  .spinner{ width:16px;height:16px; border:2.5px solid #DDD; border-top-color:var(--teal); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  #resumoTexto{ white-space:pre-wrap; line-height:1.6; font-size:.98rem; }

  .chat-log{ display:flex; flex-direction:column; gap:10px; margin-bottom:14px; min-height:340px; max-height:520px; overflow-y:auto; padding:6px; }
  .msg{ padding:11px 15px; border-radius:14px; max-width:88%; font-size:.94rem; line-height:1.55; }
  .msg.user{ align-self:flex-end; background:var(--teal); color:#fff; border-bottom-right-radius:4px; }
  .msg.ai{ align-self:flex-start; background:#F1ECDD; color:var(--ink); border-bottom-left-radius:4px; white-space:pre-wrap; }
  .chat-input{ display:flex; gap:8px; align-items:flex-end; }
  .chat-input textarea{
    flex:1; resize:vertical; border:1px solid var(--paper-line); border-radius:12px;
    padding:12px 14px; font-family:inherit; font-size:.95rem; min-height:100px; max-height:280px; line-height:1.5;
  }
  .chat-input button{ height:44px; }

  .quiz-progress{ font-size:.85rem; color:var(--muted); margin-bottom:8px; }
  .quiz-topico{ display:inline-block; background:var(--amber); color:#fff; font-size:.75rem; font-weight:700; padding:3px 10px; border-radius:999px; margin-bottom:10px; }
  .quiz-pergunta{ font-weight:600; margin:0 0 14px; font-size:1.02rem; }
  .alt-btn{
    display:block; width:100%; text-align:left; padding:12px 14px; margin-bottom:8px;
    border:1.5px solid var(--paper-line); border-radius:10px; background:#fff;
    cursor:pointer; font-family:inherit; font-size:.92rem; color:var(--ink);
  }
  .alt-btn:hover:not(:disabled){ border-color:var(--teal); }
  .alt-btn.correct{ background:#E7F6EC; border-color:var(--green); }
  .alt-btn.incorrect{ background:#FBE8E5; border-color:var(--red); }
  .alt-btn:disabled{ cursor:default; }
  .feedback-box{ margin-top:10px; padding:12px 14px; border-radius:10px; font-size:.9rem; line-height:1.5; }
  .feedback-box.ok{ background:#E7F6EC; color:#215C36; }
  .feedback-box.no{ background:#FBE8E5; color:#7A2A21; }

  .desempenho h3{ font-family:'Baloo 2',sans-serif; font-size:1.05rem; margin-top:0; }
  .desempenho ul{ margin:4px 0 16px; padding-left:20px; }
  .desempenho li{ margin-bottom:4px; font-size:.92rem; }
  .rec-box{ background:#FFF7E6; border:1px solid var(--amber); border-radius:10px; padding:14px; font-size:.93rem; }

  .empty-hint{ color:var(--muted); font-size:.9rem; text-align:center; padding:20px 0; }
  .error-box{ background:#FBE8E5; color:#7A2A21; padding:10px 14px; border-radius:10px; font-size:.88rem; margin-top:8px; }

  .materiais-list{ display:flex; flex-direction:column; gap:10px; }
  .material-item{
    display:flex; justify-content:space-between; align-items:center; padding:14px 16px;
    border:1px solid var(--paper-line); border-radius:12px; background:#FFFDF8;
  }
  .material-item .info strong{ display:block; font-size:.95rem; }
  .material-item .info span{ font-size:.8rem; color:var(--muted); }
  .revisao-quiz-item{ border:1px solid var(--paper-line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .revisao-quiz-item .quiz-pergunta{ font-size:.94rem; margin-bottom:8px; }
  .revisao-alt{ padding:6px 0; font-size:.88rem; }
  .revisao-alt.certa{ color:var(--green); font-weight:600; }
</style>
</head>
<body>

<header>
  <h1>📘 Caderno de Estudos com IA</h1>
  <p>Envie a matéria em PDF, entenda o conteúdo e treine para a prova</p>
</header>

<main>

  <div class="card">
    <div class="upload-zone" id="uploadZone">
      <label class="upload-btn" for="pdfInput">Escolher PDF da matéria</label>
      <input type="file" id="pdfInput" accept="application/pdf">
      <div id="fileName">Nenhum arquivo selecionado ainda</div>
      <input type="text" class="titulo-input" id="tituloInput" placeholder="Nome da matéria (ex: Matemática - Frações)" style="display:none;">
      <button class="primary" id="btnConfirmarUpload" style="display:none; margin-top:12px;">Começar a estudar</button>
    </div>
  </div>

  <nav class="tabs">
    <button data-tab="resumo" class="active" disabled id="tabResumoBtn">Resumo</button>
    <button data-tab="duvidas" disabled id="tabDuvidasBtn">Dúvidas</button>
    <button data-tab="exercicios" disabled id="tabExerciciosBtn">Exercícios</button>
    <button data-tab="materiais" id="tabMateriaisBtn">Meus materiais</button>
  </nav>

  <section class="card tab-panel active" id="panel-resumo">
    <div class="empty-hint">Envie um PDF acima para gerar o resumo.</div>
  </section>

  <section class="card tab-panel" id="panel-duvidas">
    <div class="empty-hint">Envie um PDF para poder tirar dúvidas.</div>
  </section>

  <section class="card tab-panel" id="panel-exercicios">
    <div class="empty-hint">Envie um PDF para gerar os exercícios.</div>
  </section>

  <section class="card tab-panel" id="panel-materiais">
    <div id="materiaisArea" class="empty-hint">Carregando...</div>
  </section>

</main>

<script>
// ============ CONFIGURAÇÃO ============
const API_URL = "https://script.google.com/macros/s/AKfycbxYkKyTbZgfn1TXCGpi-D4JGUuRsdzxyq_rUEzZJGGv3bcWibNnJ2rdNyNo-kJYNM4g0Q/exec";
// =======================================

let pdfBase64 = null;
let materialId = null;
let chatHistorico = [];
let exercicios = [];
let respostasAluno = [];
let indiceAtual = 0;

const pdfInput = document.getElementById('pdfInput');
const uploadZone = document.getElementById('uploadZone');
const fileNameEl = document.getElementById('fileName');
const tituloInput = document.getElementById('tituloInput');
const btnConfirmarUpload = document.getElementById('btnConfirmarUpload');
const tabButtons = document.querySelectorAll('nav.tabs button');

pdfInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  fileNameEl.textContent = "Lendo " + file.name + "...";
  const reader = new FileReader();
  reader.onload = () => {
    pdfBase64 = reader.result.split(',')[1];
    fileNameEl.textContent = "✅ " + file.name + " carregado";
    uploadZone.classList.add('has-file');
    tituloInput.style.display = 'block';
    tituloInput.value = file.name.replace(/\.pdf$/i, '');
    btnConfirmarUpload.style.display = 'inline-block';
  };
  reader.readAsDataURL(file);
});

btnConfirmarUpload.addEventListener('click', async () => {
  btnConfirmarUpload.disabled = true;
  btnConfirmarUpload.textContent = 'Salvando material...';
  try {
    const data = await chamarAPI({ action: 'criarMaterial', titulo: tituloInput.value || 'Sem título', pdfBase64 });
    materialId = data.id;
    ativarAbasEstudo();
  } catch (err) {
    alert('Erro ao salvar o material: ' + err.message);
    btnConfirmarUpload.disabled = false;
    btnConfirmarUpload.textContent = 'Começar a estudar';
  }
});

function ativarAbasEstudo() {
  document.getElementById('tabResumoBtn').disabled = false;
  document.getElementById('tabDuvidasBtn').disabled = false;
  document.getElementById('tabExerciciosBtn').disabled = false;

  document.getElementById('panel-resumo').innerHTML =
    '<button class="primary" id="btnGerarResumo">Gerar resumo do conteúdo</button><div id="resumoArea"></div>';
  document.getElementById('btnGerarResumo').addEventListener('click', gerarResumo);

  document.getElementById('panel-duvidas').innerHTML =
    '<div class="chat-log" id="chatLog"></div>' +
    '<div class="chat-input"><textarea id="chatInput" placeholder="Digite sua dúvida sobre a matéria..."></textarea>' +
    '<button class="primary" id="btnEnviarDuvida">Enviar</button></div>';
  document.getElementById('btnEnviarDuvida').addEventListener('click', enviarDuvida);

  document.getElementById('panel-exercicios').innerHTML =
    '<button class="primary" id="btnGerarExercicios">Gerar bateria de exercícios</button><div id="exerciciosArea"></div>';
  document.getElementById('btnGerarExercicios').addEventListener('click', gerarExercicios);

  document.querySelector('button[data-tab="resumo"]').click();
}

tabButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    tabButtons.forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'materiais') carregarListaMateriais();
  });
});

async function chamarAPI(payload) {
  const resp = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  const data = await resp.json();
  if (data.erro) throw new Error(data.erro);
  return data;
}

function loadingHTML(msg) {
  return '<div class="loading"><div class="spinner"></div>' + msg + '</div>';
}

// ---------- RESUMO ----------
async function gerarResumo() {
  const area = document.getElementById('resumoArea');
  const btn = document.getElementById('btnGerarResumo');
  btn.disabled = true;
  area.innerHTML = loadingHTML('Lendo o PDF e montando o resumo...');
  try {
    const data = await chamarAPI({ action: 'summary', materialId });
    area.innerHTML = '<div id="resumoTexto"></div>';
    document.getElementById('resumoTexto').textContent = data.resumo;
    chamarAPI({ action: 'atualizarMaterial', id: materialId, campos: { resumo: data.resumo } }).catch(()=>{});
  } catch (err) {
    area.innerHTML = '<div class="error-box">Ops, algo deu errado: ' + err.message + '</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = "Gerar novamente";
  }
}

// ---------- DÚVIDAS ----------
async function enviarDuvida() {
  const input = document.getElementById('chatInput');
  const pergunta = input.value.trim();
  if (!pergunta) return;
  const log = document.getElementById('chatLog');
  log.insertAdjacentHTML('beforeend', '<div class="msg user"></div>');
  log.lastElementChild.textContent = pergunta;
  input.value = '';
  input.style.height = '';
  log.insertAdjacentHTML('beforeend', '<div class="msg ai" id="loadingMsg">' + loadingHTML('Pensando...') + '</div>');
  log.scrollTop = log.scrollHeight;

  try {
    const data = await chamarAPI({ action: 'duvida', materialId, pergunta, historico: chatHistorico });
    chatHistorico.push({ role: 'user', content: pergunta });
    chatHistorico.push({ role: 'assistant', content: data.resposta });
    document.getElementById('loadingMsg').outerHTML = '<div class="msg ai"></div>';
    log.lastElementChild.textContent = data.resposta;
    chamarAPI({ action: 'atualizarMaterial', id: materialId, campos: { chatHistorico } }).catch(()=>{});
  } catch (err) {
    document.getElementById('loadingMsg').outerHTML = '<div class="msg ai error-box">Erro: ' + err.message + '</div>';
  }
  log.scrollTop = log.scrollHeight;
}

// ---------- EXERCÍCIOS ----------
async function gerarExercicios() {
  const area = document.getElementById('exerciciosArea');
  const btn = document.getElementById('btnGerarExercicios');
  if (btn) btn.disabled = true;
  area.innerHTML = loadingHTML('Preparando os exercícios...');
  try {
    const data = await chamarAPI({ action: 'quiz', materialId, numQuestoes: 8 });
    exercicios = data.exercicios;
    respostasAluno = [];
    indiceAtual = 0;
    if (btn) btn.style.display = 'none';
    mostrarQuestao();
    chamarAPI({ action: 'atualizarMaterial', id: materialId, campos: { exercicios } }).catch(()=>{});
  } catch (err) {
    area.innerHTML = '<div class="error-box">Ops, algo deu errado: ' + err.message + '</div>';
    if (btn) btn.disabled = false;
  }
}

function mostrarQuestao() {
  const area = document.getElementById('exerciciosArea');
  if (indiceAtual >= exercicios.length) {
    avaliarDesempenho();
    return;
  }
  const q = exercicios[indiceAtual];
  let html = '<div class="quiz-progress">Questão ' + (indiceAtual + 1) + ' de ' + exercicios.length + '</div>';
  html += '<div class="quiz-topico">' + q.topico + '</div>';
  html += '<p class="quiz-pergunta">' + q.pergunta + '</p>';
  q.alternativas.forEach((alt, i) => {
    html += '<button class="alt-btn" data-idx="' + i + '">' + alt + '</button>';
  });
  html += '<div id="feedbackArea"></div>';
  area.innerHTML = html;

  document.querySelectorAll('.alt-btn').forEach(b => {
    b.addEventListener('click', () => responder(parseInt(b.dataset.idx), q));
  });
}

function responder(idx, q) {
  const acertou = idx === q.resposta_correta;
  respostasAluno.push({ topico: q.topico, acertou });

  document.querySelectorAll('.alt-btn').forEach((b, i) => {
    b.disabled = true;
    if (i === q.resposta_correta) b.classList.add('correct');
    else if (i === idx && !acertou) b.classList.add('incorrect');
  });

  const fb = document.getElementById('feedbackArea');
  fb.innerHTML = '<div class="feedback-box ' + (acertou ? 'ok' : 'no') + '">' +
    (acertou ? '✅ Acertou! ' : '❌ Quase — ') + q.explicacao + '</div>' +
    '<button class="primary" id="btnProxima" style="margin-top:12px;">' +
    (indiceAtual < exercicios.length - 1 ? 'Próxima questão' : 'Ver meu desempenho') + '</button>';

  document.getElementById('btnProxima').addEventListener('click', () => {
    indiceAtual++;
    mostrarQuestao();
  });
}

async function avaliarDesempenho() {
  const area = document.getElementById('exerciciosArea');
  area.innerHTML = loadingHTML('Analisando seu desempenho...');
  try {
    const data = await chamarAPI({ action: 'avaliar', respostas: respostasAluno });
    let html = '<div class="desempenho">';
    html += '<h3>👍 Você mandou bem em:</h3><ul>';
    data.pontos_fortes.forEach(p => html += '<li>' + p + '</li>');
    html += '</ul>';
    if (data.pontos_fracos && data.pontos_fracos.length) {
      html += '<h3>📌 Vale revisar:</h3><ul>';
      data.pontos_fracos.forEach(p => html += '<li>' + p + '</li>');
      html += '</ul>';
    }
    html += '<div class="rec-box">' + data.recomendacao + '</div>';
    html += '<button class="primary" id="btnNovaBateria" style="margin-top:16px;">Fazer nova bateria</button>';
    html += '</div>';
    area.innerHTML = html;
    document.getElementById('btnNovaBateria').addEventListener('click', gerarExercicios);
    chamarAPI({ action: 'atualizarMaterial', id: materialId, campos: { desempenho: data } }).catch(()=>{});
  } catch (err) {
    area.innerHTML = '<div class="error-box">Erro ao avaliar: ' + err.message + '</div>';
  }
}

// ---------- MEUS MATERIAIS ----------
async function carregarListaMateriais() {
  const area = document.getElementById('materiaisArea');
  area.innerHTML = loadingHTML('Carregando seus materiais...');
  try {
    const data = await chamarAPI({ action: 'listarMateriais' });
    if (!data.materiais.length) {
      area.innerHTML = '<div class="empty-hint">Nenhum material salvo ainda. Envie um PDF acima para começar.</div>';
      return;
    }
    let html = '<div class="materiais-list">';
    data.materiais.forEach(m => {
      const data2 = new Date(m.dataCriacao);
      html += '<div class="material-item"><div class="info"><strong>' + m.titulo + '</strong>' +
        '<span>' + data2.toLocaleDateString('pt-BR') + '</span></div>' +
        '<div style="display:flex; gap:8px;">' +
        '<button class="secondary" data-id="' + m.id + '">Abrir</button>' +
        '<button class="secondary" data-del="' + m.id + '" style="color:var(--red); border-color:#F0C9C4;">Excluir</button>' +
        '</div></div>';
    });
    html += '</div>';
    area.innerHTML = html;
    area.querySelectorAll('button[data-id]').forEach(b => {
      b.addEventListener('click', () => abrirMaterialSalvo(b.dataset.id));
    });
    area.querySelectorAll('button[data-del]').forEach(b => {
      b.addEventListener('click', () => excluirMaterialSalvo(b.dataset.del));
    });
  } catch (err) {
    area.innerHTML = '<div class="error-box">Erro ao carregar: ' + err.message + '</div>';
  }
}

async function abrirMaterialSalvo(id) {
  const area = document.getElementById('materiaisArea');
  area.innerHTML = loadingHTML('Abrindo material...');
  try {
    const data = await chamarAPI({ action: 'carregarMaterial', id });
    materialId = id;
    pdfBase64 = null;
    chatHistorico = data.chatHistorico || [];
    exercicios = data.exercicios ? data.exercicios.exercicios || data.exercicios : [];

    ativarAbasEstudo();

    // Resumo
    if (data.resumo) {
      document.getElementById('panel-resumo').innerHTML = '<div id="resumoTexto"></div>' +
        '<button class="primary" id="btnGerarResumo" style="margin-top:14px;">Gerar novamente</button><div id="resumoArea"></div>';
      document.getElementById('resumoTexto').textContent = data.resumo;
      document.getElementById('btnGerarResumo').addEventListener('click', gerarResumo);
    }

    // Chat
    const log = document.getElementById('chatLog');
    log.innerHTML = '';
    chatHistorico.forEach(m => {
      log.insertAdjacentHTML('beforeend', '<div class="msg ' + (m.role === 'user' ? 'user' : 'ai') + '"></div>');
      log.lastElementChild.textContent = m.content;
    });
    log.scrollTop = log.scrollHeight;

    // Exercícios (modo revisão) + desempenho salvo
    const exArea = document.getElementById('panel-exercicios');
    let html = '';
    if (data.desempenho) {
      html += '<div class="desempenho"><h3>Último desempenho registrado</h3>';
      html += '<h3>👍 Pontos fortes:</h3><ul>' + data.desempenho.pontos_fortes.map(p => '<li>'+p+'</li>').join('') + '</ul>';
      html += '<h3>📌 Vale revisar:</h3><ul>' + (data.desempenho.pontos_fracos||[]).map(p => '<li>'+p+'</li>').join('') + '</ul>';
      html += '<div class="rec-box">' + data.desempenho.recomendacao + '</div></div>';
    }
    if (exercicios && exercicios.length) {
      html += '<h3 style="font-family:\'Baloo 2\',sans-serif;">Exercícios salvos (revisão)</h3>';
      exercicios.forEach(q => {
        html += '<div class="revisao-quiz-item"><div class="quiz-topico">' + q.topico + '</div>' +
          '<div class="quiz-pergunta">' + q.pergunta + '</div>';
        q.alternativas.forEach((alt, i) => {
          html += '<div class="revisao-alt' + (i === q.resposta_correta ? ' certa' : '') + '">' + alt + (i === q.resposta_correta ? ' ✅' : '') + '</div>';
        });
        html += '<div style="font-size:.85rem; color:var(--muted); margin-top:6px;">' + q.explicacao + '</div></div>';
      });
    }
    html += '<button class="primary" id="btnGerarExercicios" style="margin-top:10px;">Fazer nova bateria de exercícios</button><div id="exerciciosArea2"></div>';
    exArea.innerHTML = html;
    document.getElementById('btnGerarExercicios').addEventListener('click', () => {
      exArea.innerHTML = '<div id="exerciciosArea"></div>';
      gerarExercicios();
    });

    document.querySelector('button[data-tab="resumo"]').click();
  } catch (err) {
    area.innerHTML = '<div class="error-box">Erro ao abrir: ' + err.message + '</div>';
  }
}

async function excluirMaterialSalvo(id) {
  if (!confirm('Tem certeza que quer excluir este caderno? O PDF e tudo que foi gerado (resumo, exercícios, dúvidas) serão apagados e não dá para desfazer.')) return;
  try {
    await chamarAPI({ action: 'excluirMaterial', id });
    carregarListaMateriais();
  } catch (err) {
    alert('Erro ao excluir: ' + err.message);
  }
}

carregarListaMateriais();
</script>
